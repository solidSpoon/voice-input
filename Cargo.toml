[package]
name = "voice-input"
version = "0.1.0"
edition = "2021"

# 核心库以 cdylib 形式导出 C ABI，供 fcitx5 插件（C++）链接
[lib]
name = "voiceinput_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
alsa = "0.9"
chrono = "0.4"
dirs = "5"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "0.8"
base64 = "0.22"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[profile.dev]
opt-level = 1
